<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480pt" height="698pt" viewBox="0 0 480 698">
<rect x="0" y="0" width="480" height="698" fill="#ffffff"/>
<text x="240.00" y="20.00" font-family="Arial, Helvetica, sans-serif" font-size="11.50" fill="#1f3b63" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan>ONC chain: conflict with an oncoming vehicle</tspan></text>
<text x="240.00" y="33.00" font-family="Arial, Helvetica, sans-serif" font-size="8.00" fill="#8a8a8a" text-anchor="middle" xml:space="preserve"><tspan>Derivation runs downward, from the collision (lagging SPI) back to the earliest observable signals</tspan></text>
<rect x="14.00" y="41.00" width="428.00" height="48.00" rx="3" ry="3" fill="#9e4746" stroke="#833938" stroke-width="0.9"/>
<text x="21.00" y="57.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#ffffff" font-weight="bold" xml:space="preserve"><tspan>LAGGING SPI: ONC collision</tspan></text>
<text x="21.00" y="71.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#ffffff" xml:space="preserve"><tspan>SPI: runs with a collision with an oncoming vehicle per 10</tspan><tspan font-size="6.05" baseline-shift="super">5</tspan><tspan> manoeuvres &lt; T</tspan><tspan font-size="6.05" baseline-shift="sub">ONC</tspan></text>
<text x="21.00" y="82.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#ffffff" xml:space="preserve"><tspan>Metric: contact between the ego vehicle and an oncoming vehicle.</tspan></text>
<polyline points="228.00,89.00 228.00,104.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,109.00 225.00,103.00 231.00,103.00" fill="#8a8a8a"/>
<text x="234.00" y="102.00" font-family="Arial, Helvetica, sans-serif" font-size="7.60" fill="#8a8a8a" font-style="italic" xml:space="preserve"><tspan>why</tspan></text>
<rect x="14.00" y="109.00" width="428.00" height="48.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="21.00" y="125.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>PROXIMATE CAUSE</tspan></text>
<text x="21.00" y="139.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>The ego vehicle occupied the conflict area while an oncoming vehicle was closing on it, and no avoidance</tspan></text>
<text x="21.00" y="150.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>action succeeded in time.</tspan></text>
<polyline points="228.00,157.00 228.00,172.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,177.00 225.00,171.00 231.00,171.00" fill="#8a8a8a"/>
<text x="234.00" y="170.00" font-family="Arial, Helvetica, sans-serif" font-size="7.60" fill="#8a8a8a" font-style="italic" xml:space="preserve"><tspan>reaction tier (last resort, nearest the loss)</tspan></text>
<rect x="14.00" y="177.00" width="428.00" height="70.00" rx="3" ry="3" fill="#b26a63" stroke="#9a5650" stroke-width="0.9"/>
<text x="21.00" y="193.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#ffffff" font-weight="bold" xml:space="preserve"><tspan>INTERMEDIATE LEADING SPI: AEB_ONC</tspan></text>
<text x="21.00" y="207.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#ffffff" xml:space="preserve"><tspan>SPI: runs with an emergency braking event with a gated oncoming vehicle in conflict</tspan></text>
<text x="21.00" y="218.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#ffffff" xml:space="preserve"><tspan>per 10</tspan><tspan font-size="6.05" baseline-shift="super">5</tspan><tspan> manoeuvres &lt; T</tspan><tspan font-size="6.05" baseline-shift="sub">AEB_ONC</tspan></text>
<text x="21.00" y="229.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#ffffff" xml:space="preserve"><tspan>Metric: hard emergency brake while an oncoming vehicle was within the collision horizon. Mitigation attempted,</tspan></text>
<text x="21.00" y="240.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#ffffff" xml:space="preserve"><tspan>collision not yet realised.</tspan></text>
<polyline points="228.00,247.00 228.00,262.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,267.00 225.00,261.00 231.00,261.00" fill="#8a8a8a"/>
<text x="234.00" y="260.00" font-family="Arial, Helvetica, sans-serif" font-size="7.60" fill="#8a8a8a" font-style="italic" xml:space="preserve"><tspan>decompose the proximate cause (kinematic precursor tier)</tspan></text>
<polygon points="133.00,267.00 323.00,267.00 333.00,277.00 323.00,287.00 133.00,287.00 123.00,277.00" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="0.9"/>
<text x="228.00" y="280.00" font-family="Arial, Helvetica, sans-serif" font-size="8.20" fill="#1a1a1a" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan>OR gate: either cause alone is sufficient</tspan></text>
<polyline points="228.00,287.00 228.00,295.00 118.00,295.00 118.00,306.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="118.00,311.00 115.00,305.00 121.00,305.00" fill="#8a8a8a"/>
<polyline points="228.00,287.00 228.00,295.00 338.00,295.00 338.00,306.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="338.00,311.00 335.00,305.00 341.00,305.00" fill="#8a8a8a"/>
<rect x="14.00" y="311.00" width="208.00" height="70.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="21.00" y="327.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>CAUSE A</tspan></text>
<text x="21.00" y="341.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>The accepted gap was already insufficient when the</tspan></text>
<text x="21.00" y="352.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>manoeuvre began.</tspan></text>
<text x="21.00" y="363.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>Planning subsystem.</tspan></text>
<rect x="234.00" y="311.00" width="208.00" height="70.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="241.00" y="327.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>CAUSE B</tspan></text>
<text x="241.00" y="341.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>Closing speed exceeded what the turn arc allowed</tspan></text>
<text x="241.00" y="352.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>because of increased oncoming velocity, so the</tspan></text>
<text x="241.00" y="363.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>deceleration needed rose beyond normal braking.</tspan></text>
<text x="241.00" y="374.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>Prediction subsystem.</tspan></text>
<polyline points="118.00,381.00 118.00,392.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="118.00,397.00 115.00,391.00 121.00,391.00" fill="#8a8a8a"/>
<polyline points="338.00,381.00 338.00,392.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="338.00,397.00 335.00,391.00 341.00,391.00" fill="#8a8a8a"/>
<rect x="14.00" y="397.00" width="208.00" height="48.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="21.00" y="413.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>SIGNAL A</tspan></text>
<text x="21.00" y="427.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>TTC to the nearest closing oncoming vehicle,</tspan></text>
<text x="21.00" y="438.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>sampled each frame.</tspan></text>
<rect x="234.00" y="397.00" width="208.00" height="48.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="241.00" y="413.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>SIGNAL B</tspan></text>
<text x="241.00" y="427.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>Deceleration required to stop short of the conflict</tspan></text>
<text x="241.00" y="438.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>area at the current speed, sampled each frame.</tspan></text>
<polyline points="14.00,458.00 442.00,458.00" fill="none" stroke="#b0b0b0" stroke-width="0.8" stroke-dasharray="3,3"/>
<rect x="158.57" y="452.00" width="138.86" height="12.00" rx="0" ry="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="228.00" y="461.00" font-family="Arial, Helvetica, sans-serif" font-size="7.60" fill="#8a8a8a" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan>observability and independence check</tspan></text>
<polyline points="118.00,445.00 118.00,468.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="118.00,473.00 115.00,467.00 121.00,467.00" fill="#8a8a8a"/>
<polyline points="338.00,445.00 338.00,468.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="338.00,473.00 335.00,467.00 341.00,467.00" fill="#8a8a8a"/>
<rect x="14.00" y="473.00" width="208.00" height="70.00" rx="3" ry="3" fill="#dfa640" stroke="#c08f2e" stroke-width="0.9"/>
<text x="21.00" y="489.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#3d2f08" font-weight="bold" xml:space="preserve"><tspan>LEADING SPI: GAP_TTC</tspan></text>
<text x="21.00" y="503.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>SPI: runs with GAP_TTC below θ</tspan></text>
<text x="21.00" y="514.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>per 10</tspan><tspan font-size="6.05" baseline-shift="super">5</tspan><tspan> manoeuvres &lt; T</tspan><tspan font-size="6.05" baseline-shift="sub">GAP_TTC</tspan></text>
<text x="21.00" y="525.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>Metric: minimum gap TTC over the manoeuvre.</tspan></text>
<rect x="234.00" y="473.00" width="208.00" height="70.00" rx="3" ry="3" fill="#dfa640" stroke="#c08f2e" stroke-width="0.9"/>
<text x="241.00" y="489.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#3d2f08" font-weight="bold" xml:space="preserve"><tspan>LEADING SPI: REQ_DECEL</tspan></text>
<text x="241.00" y="503.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>SPI: runs with REQ_DECEL above θ</tspan></text>
<text x="241.00" y="514.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>per 10</tspan><tspan font-size="6.05" baseline-shift="super">5</tspan><tspan> manoeuvres &lt; T</tspan><tspan font-size="6.05" baseline-shift="sub">REQ_DECEL</tspan></text>
<text x="241.00" y="525.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>Metric: maximum required deceleration over the</tspan></text>
<text x="241.00" y="536.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>manoeuvre.</tspan></text>
<polyline points="118.00,543.00 118.00,552.00 338.00,552.00 338.00,543.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polyline points="228.00,552.00 228.00,560.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,565.00 225.00,559.00 231.00,559.00" fill="#8a8a8a"/>
<rect x="14.00" y="565.00" width="428.00" height="48.00" rx="3" ry="3" fill="#dce5f1" stroke="#9fb3cd" stroke-width="0.9"/>
<text x="21.00" y="581.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>ATTACH TO THE SAFETY CASE</tspan></text>
<text x="21.00" y="595.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>GAP_TTC on G2.1 and REQ_DECEL on G2.2 as leading evidence; AEB_ONC as intermediate leading and the</tspan></text>
<text x="21.00" y="606.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>ONC collision as lagging evidence on G2, the oncoming-conflict goal.</tspan></text>
<polyline points="442.00,212.00 451.00,212.00" fill="none" stroke="#9a5650" stroke-width="0.9"/>
<polyline points="451.00,212.00 451.00,589.00" fill="none" stroke="#9a5650" stroke-width="0.9" stroke-dasharray="3,2.5"/>
<polyline points="451.00,589.00 448.00,589.00" fill="none" stroke="#9a5650" stroke-width="0.9"/>
<polygon points="442.00,589.00 447.50,586.25 447.50,591.75" fill="#9a5650"/>
<g transform="translate(460.00,400.50) rotate(90)"><text x="0.00" y="0.00" font-family="Arial, Helvetica, sans-serif" font-size="7.40" fill="#9a5650" text-anchor="middle" xml:space="preserve"><tspan>AEB_ONC attaches directly, independent of the kinematic tier</tspan></text></g>
<polyline points="228.00,613.00 228.00,624.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,629.00 225.00,623.00 231.00,623.00" fill="#8a8a8a"/>
<rect x="14.00" y="629.00" width="428.00" height="59.00" rx="3" ry="3" fill="#dce5f1" stroke="#9fb3cd" stroke-width="0.9"/>
<text x="21.00" y="645.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>VALIDATE</tspan></text>
<text x="21.00" y="659.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>Temporal precedence is checked against the ONC collision only. Incidents are attributed by actor identity, so a</tspan></text>
<text x="21.00" y="670.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>pedestrian or a rear impact is never counted here. The metric is separated between uneventful and</tspan></text>
<text x="21.00" y="681.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>ONC-collision manoeuvres.</tspan></text>
</svg>
