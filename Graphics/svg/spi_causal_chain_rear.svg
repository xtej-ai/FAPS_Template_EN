<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480pt" height="687pt" viewBox="0 0 480 687">
<rect x="0" y="0" width="480" height="687" fill="#ffffff"/>
<text x="240.00" y="20.00" font-family="Arial, Helvetica, sans-serif" font-size="11.50" fill="#1f3b63" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan>REAR chain: conflict with a following vehicle</tspan></text>
<text x="240.00" y="33.00" font-family="Arial, Helvetica, sans-serif" font-size="8.00" fill="#8a8a8a" text-anchor="middle" xml:space="preserve"><tspan>Derivation runs downward, from the collision (lagging SPI) back to the earliest observable signals</tspan></text>
<rect x="14.00" y="41.00" width="428.00" height="48.00" rx="3" ry="3" fill="#9e4746" stroke="#833938" stroke-width="0.9"/>
<text x="21.00" y="57.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#ffffff" font-weight="bold" xml:space="preserve"><tspan>LAGGING SPI: REAR collision</tspan></text>
<text x="21.00" y="71.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#ffffff" xml:space="preserve"><tspan>SPI: runs with a collision with the following vehicle per 10</tspan><tspan font-size="6.05" baseline-shift="super">5</tspan><tspan> manoeuvres &lt; T</tspan><tspan font-size="6.05" baseline-shift="sub">REAR</tspan></text>
<text x="21.00" y="82.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#ffffff" xml:space="preserve"><tspan>Metric: contact between the following vehicle and the ego vehicle.</tspan></text>
<polyline points="228.00,89.00 228.00,104.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,109.00 225.00,103.00 231.00,103.00" fill="#8a8a8a"/>
<text x="234.00" y="102.00" font-family="Arial, Helvetica, sans-serif" font-size="7.60" fill="#8a8a8a" font-style="italic" xml:space="preserve"><tspan>why</tspan></text>
<rect x="14.00" y="109.00" width="428.00" height="59.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="21.00" y="125.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>PROXIMATE CAUSE</tspan></text>
<text x="21.00" y="139.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>The ego vehicle decelerated inside the manoeuvre, at turn entry or at a pedestrian stop, and the follower did</tspan></text>
<text x="21.00" y="150.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>not arrest its approach within the gap that remained. No third party is involved: the hazard is created by the ego</tspan></text>
<text x="21.00" y="161.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>vehicle's own deceleration.</tspan></text>
<polyline points="228.00,168.00 228.00,183.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,188.00 225.00,182.00 231.00,182.00" fill="#8a8a8a"/>
<text x="234.00" y="181.00" font-family="Arial, Helvetica, sans-serif" font-size="7.60" fill="#8a8a8a" font-style="italic" xml:space="preserve"><tspan>reaction tier</tspan></text>
<rect x="14.00" y="188.00" width="428.00" height="48.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="21.00" y="204.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>NO REACTION-TIER INDICATOR ON THIS CHAIN</tspan></text>
<text x="21.00" y="218.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>The ego vehicle has no last-resort mitigation directed rearward, so the reaction tier present on the ONC and</tspan></text>
<text x="21.00" y="229.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>PED chains is empty here.</tspan></text>
<polyline points="228.00,236.00 228.00,251.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,256.00 225.00,250.00 231.00,250.00" fill="#8a8a8a"/>
<text x="234.00" y="249.00" font-family="Arial, Helvetica, sans-serif" font-size="7.60" fill="#8a8a8a" font-style="italic" xml:space="preserve"><tspan>decompose the proximate cause (kinematic precursor tier)</tspan></text>
<polygon points="133.00,256.00 323.00,256.00 333.00,266.00 323.00,276.00 133.00,276.00 123.00,266.00" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="0.9"/>
<text x="228.00" y="269.00" font-family="Arial, Helvetica, sans-serif" font-size="8.20" fill="#1a1a1a" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan>OR gate: either cause alone is sufficient</tspan></text>
<polyline points="228.00,276.00 228.00,284.00 118.00,284.00 118.00,295.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="118.00,300.00 115.00,294.00 121.00,294.00" fill="#8a8a8a"/>
<polyline points="228.00,276.00 228.00,284.00 338.00,284.00 338.00,295.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="338.00,300.00 335.00,294.00 341.00,294.00" fill="#8a8a8a"/>
<rect x="14.00" y="300.00" width="208.00" height="70.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="21.00" y="316.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>CAUSE A</tspan></text>
<text x="21.00" y="330.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>The gap held by the follower was already too small</tspan></text>
<text x="21.00" y="341.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>to absorb a deceleration of the magnitude the</tspan></text>
<text x="21.00" y="352.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>manoeuvre requires.</tspan></text>
<text x="21.00" y="363.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>Ego planning subsystem, through its speed profile.</tspan></text>
<rect x="234.00" y="300.00" width="208.00" height="70.00" rx="3" ry="3" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="0.9"/>
<text x="241.00" y="316.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#6b6b6b" font-weight="bold" xml:space="preserve"><tspan>CAUSE B</tspan></text>
<text x="241.00" y="330.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>The follower responded late, continuing to close for</tspan></text>
<text x="241.00" y="341.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>an interval after braking began.</tspan></text>
<text x="241.00" y="352.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>Follower's own driver or control stack.</tspan></text>
<polyline points="118.00,370.00 118.00,381.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="118.00,386.00 115.00,380.00 121.00,380.00" fill="#8a8a8a"/>
<polyline points="338.00,370.00 338.00,381.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="338.00,386.00 335.00,380.00 341.00,380.00" fill="#8a8a8a"/>
<rect x="14.00" y="386.00" width="208.00" height="48.00" rx="3" ry="3" fill="#fbfcfe" stroke="#c3ccd8" stroke-width="0.9"/>
<text x="21.00" y="402.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>SIGNAL A</tspan></text>
<text x="21.00" y="416.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>Line-of-sight time to collision from the follower to the</tspan></text>
<text x="21.00" y="427.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#1a1a1a" xml:space="preserve"><tspan>ego vehicle, sampled each frame.</tspan></text>
<rect x="234.00" y="386.00" width="208.00" height="48.00" rx="3" ry="3" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="0.9"/>
<text x="241.00" y="402.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#6b6b6b" font-weight="bold" xml:space="preserve"><tspan>SIGNAL B</tspan></text>
<text x="241.00" y="416.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>Reaction delay of the following vehicle, measured</tspan></text>
<text x="241.00" y="427.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>from brake onset.</tspan></text>
<polyline points="14.00,447.00 442.00,447.00" fill="none" stroke="#b0b0b0" stroke-width="0.8" stroke-dasharray="3,3"/>
<rect x="158.57" y="441.00" width="138.86" height="12.00" rx="0" ry="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="228.00" y="450.00" font-family="Arial, Helvetica, sans-serif" font-size="7.60" fill="#8a8a8a" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan>observability and independence check</tspan></text>
<polyline points="118.00,434.00 118.00,457.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="118.00,462.00 115.00,456.00 121.00,456.00" fill="#8a8a8a"/>
<polyline points="338.00,434.00 338.00,457.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="338.00,462.00 335.00,456.00 341.00,456.00" fill="#8a8a8a"/>
<rect x="14.00" y="462.00" width="208.00" height="70.00" rx="3" ry="3" fill="#dfa640" stroke="#c08f2e" stroke-width="0.9"/>
<text x="21.00" y="478.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#3d2f08" font-weight="bold" xml:space="preserve"><tspan>LEADING SPI: REAR_TTC</tspan></text>
<text x="21.00" y="492.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>SPI: runs with REAR_TTC below θ</tspan></text>
<text x="21.00" y="503.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>per 10</tspan><tspan font-size="6.05" baseline-shift="super">5</tspan><tspan> manoeuvres &lt; T</tspan><tspan font-size="6.05" baseline-shift="sub">REAR_TTC</tspan></text>
<text x="21.00" y="514.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>Metric: minimum line-of-sight TTC, follower to ego</tspan></text>
<text x="21.00" y="525.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#3d2f08" xml:space="preserve"><tspan>vehicle.</tspan></text>
<rect x="234.00" y="462.00" width="208.00" height="70.00" rx="3" ry="3" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="0.9"/>
<text x="241.00" y="478.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#6b6b6b" font-weight="bold" xml:space="preserve"><tspan>REJECTED AT STEP 5</tspan></text>
<text x="241.00" y="492.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>Not observable to the ego vehicle: the quantity</tspan></text>
<text x="241.00" y="503.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>belongs to the following driver and is available in</tspan></text>
<text x="241.00" y="514.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>simulation only because the delay is a sampled</tspan></text>
<text x="241.00" y="525.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#6b6b6b" xml:space="preserve"><tspan>parameter.</tspan></text>
<polyline points="338.00,532.00 338.00,541.00 118.00,541.00" fill="none" stroke="#c9c9c9" stroke-width="0.9" stroke-dasharray="3,3"/>
<polyline points="118.00,532.00 118.00,549.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="118.00,554.00 115.00,548.00 121.00,548.00" fill="#8a8a8a"/>
<rect x="14.00" y="554.00" width="428.00" height="48.00" rx="3" ry="3" fill="#dce5f1" stroke="#9fb3cd" stroke-width="0.9"/>
<text x="21.00" y="570.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>ATTACH TO THE SAFETY CASE</tspan></text>
<text x="21.00" y="584.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>REAR_TTC on G4.1 as leading evidence and the REAR collision as lagging evidence on G4, the</tspan></text>
<text x="21.00" y="595.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>following-conflict goal. The rejected branch corresponds to the undeveloped goal G4.2.</tspan></text>
<polyline points="228.00,602.00 228.00,613.00" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
<polygon points="228.00,618.00 225.00,612.00 231.00,612.00" fill="#8a8a8a"/>
<rect x="14.00" y="618.00" width="428.00" height="59.00" rx="3" ry="3" fill="#dce5f1" stroke="#9fb3cd" stroke-width="0.9"/>
<text x="21.00" y="634.00" font-family="Arial, Helvetica, sans-serif" font-size="9.00" fill="#1f3b63" font-weight="bold" xml:space="preserve"><tspan>VALIDATE</tspan></text>
<text x="21.00" y="648.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>Scored only on runs in which a follower is present, since the hazard cannot arise without one. The acceptance</tspan></text>
<text x="21.00" y="659.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>criterion is argued on the baseline-comparison principle, the following driver being a participant in the same</tspan></text>
<text x="21.00" y="670.00" font-family="Arial, Helvetica, sans-serif" font-size="8.40" fill="#2c4062" xml:space="preserve"><tspan>traffic system.</tspan></text>
</svg>
